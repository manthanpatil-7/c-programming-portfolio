<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="900" height="600" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- title -->
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2328">BroBank — Module Structure</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#57606a">main.c programs against bank.h; all rules and file access live in bank.c</text>

  <!-- main.c -->
  <rect x="290" y="90" width="320" height="70" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="450" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#0a3069">main.c</text>
  <text x="450" y="140" text-anchor="middle" font-size="12" fill="#0a3069">menu loop · input validation · session history</text>

  <!-- arrow main -> bank.h -->
  <line x1="450" y1="160" x2="450" y2="196" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="450,204 444,192 456,192" fill="#57606a"/>
  <text x="462" y="186" font-size="11" fill="#57606a">calls</text>

  <!-- bank.h bar -->
  <rect x="200" y="204" width="500" height="44" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="450" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#4d2d00">bank.h — public interface</text>
  <text x="450" y="241" text-anchor="middle" font-size="11" fill="#4d2d00">the only way main.c touches the account</text>

  <!-- arrow bank.h -> bank.c -->
  <line x1="450" y1="248" x2="450" y2="282" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="450,290 444,278 456,278" fill="#57606a"/>
  <text x="462" y="272" font-size="11" fill="#57606a">implemented by</text>

  <!-- bank.c container -->
  <rect x="60" y="290" width="780" height="160" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="450" y="315" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2328">bank.c</text>

  <!-- four sections -->
  <rect x="80" y="330" width="175" height="100" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="167" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#116329">Account operations</text>
  <text x="167" y="374" text-anchor="middle" font-size="11" fill="#116329">deposit()</text>
  <text x="167" y="390" text-anchor="middle" font-size="11" fill="#116329">withdraw()</text>
  <text x="167" y="412" text-anchor="middle" font-size="10" fill="#57606a">Exercise 7 · pointer API</text>

  <rect x="270" y="330" width="185" height="100" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="362" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#116329">Persistence &amp; log</text>
  <text x="362" y="371" text-anchor="middle" font-size="11" fill="#116329">loadBalance() · saveBalance()</text>
  <text x="362" y="387" text-anchor="middle" font-size="11" fill="#116329">logTransaction()</text>
  <text x="362" y="412" text-anchor="middle" font-size="10" fill="#57606a">Exercise 6 · file I/O</text>

  <rect x="470" y="330" width="195" height="100" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="567" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#116329">Session statement</text>
  <text x="567" y="371" text-anchor="middle" font-size="11" fill="#116329">sortTransactions() · bubbleSortFloats()</text>
  <text x="567" y="387" text-anchor="middle" font-size="11" fill="#116329">calculateBalance() · printTransactions()</text>
  <text x="567" y="412" text-anchor="middle" font-size="10" fill="#57606a">Exercise 8 · sorting</text>

  <rect x="680" y="330" width="140" height="100" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="750" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#116329">UI helpers</text>
  <text x="750" y="374" text-anchor="middle" font-size="11" fill="#116329">printMenu()</text>
  <text x="750" y="390" text-anchor="middle" font-size="11" fill="#116329">printBalance()</text>
  <text x="750" y="412" text-anchor="middle" font-size="10" fill="#57606a">Exercise 5 · menu</text>

  <!-- arrows persistence -> files -->
  <line x1="310" y1="450" x2="255" y2="505" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="250,510 254,497 263,505" fill="#57606a"/>
  <line x1="415" y1="450" x2="470" y2="505" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="475,510 462,505 471,497" fill="#57606a"/>

  <!-- data files -->
  <rect x="120" y="512" width="260" height="52" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="250" y="534" text-anchor="middle" font-size="13" font-weight="bold" fill="#6639ba">brobank_data.txt</text>
  <text x="250" y="551" text-anchor="middle" font-size="11" fill="#6639ba">balance saved between runs</text>

  <rect x="420" y="512" width="290" height="52" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="565" y="534" text-anchor="middle" font-size="13" font-weight="bold" fill="#6639ba">transactions.txt</text>
  <text x="565" y="551" text-anchor="middle" font-size="11" fill="#6639ba">dated CSV log of successful transactions</text>
</svg>